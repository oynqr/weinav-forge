[package]
name = "weinav-forge"
version = "0.1.0"
edition = "2024"
description = "Build GNSS assistance data for Huawei watches and Gadgetbridge"
license = "AGPL-3.0-only"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
lzw_z = { package = "newtua-lzw-z", version = "0.1" }
roxmltree = "0.20"
wreq = { version = "0.16.1", default-features = false, features = [
  "tokio-rt",
  "webpki-roots",
  "stream",
] }
wreq-util = "0.2"
tokio = { version = "1", features = ["rt", "time", "net"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
