version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "03:27"
      timezone: Etc/UTC
    commit-message:
      prefix: chore

updates:
  - package-ecosystem: cargo
    directory: /
    multi-ecosystem-group: dependencies
    patterns:
      - "*"
    versioning-strategy: lockfile-only
    allow:
      - dependency-type: all
    cooldown:
      default-days: 2
    groups:
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: nix
    directory: /
    multi-ecosystem-group: dependencies
    patterns:
      - "*"

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: dependencies
    patterns:
      - "*"
