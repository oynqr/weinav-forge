name: merge action updates

on:
  workflow_run:
    workflows: [build]
    types: [completed]

concurrency:
  group: merge-action-updates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  merge:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'pull_request'
          && github.event.workflow_run.head_repository.full_name == github.repository
          && github.event.workflow_run.pull_requests[0].number != null }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BASE_REVISION: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
      CHECKED_REVISION: ${{ github.event.workflow_run.head_sha }}
      PULL_REQUEST: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - name: Verify and fast-forward the Dependabot pull request
        run: |
          [[ "$BASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CHECKED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PULL_REQUEST" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" > "$RUNNER_TEMP/action-update-pr.json"
          if ! jq -e '.user.login == "dependabot[bot]" and .user.type == "Bot"' \
            "$RUNNER_TEMP/action-update-pr.json" > /dev/null; then
            exit 0
          fi
          mergeability_attempts=12
          mergeability_delay=5
          for ((attempt = 0; attempt < mergeability_attempts; attempt++)); do
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" > "$RUNNER_TEMP/action-update-pr.json"
            if jq -e '.mergeable_state == "clean"' "$RUNNER_TEMP/action-update-pr.json" > /dev/null; then
              break
            fi
            sleep "$mergeability_delay"
          done
          jq -e --arg revision "$CHECKED_REVISION" --arg base "$BASE_REVISION" \
            --arg branch "$DEFAULT_BRANCH" --arg repository "$GITHUB_REPOSITORY" \
            '.user.login == "dependabot[bot]" and .user.type == "Bot"
              and .state == "open" and .draft == false and .merged == false
              and .head.sha == $revision and .base.sha == $base and .base.ref == $branch
              and .head.repo.full_name == $repository and .base.repo.full_name == $repository
              and .mergeable_state == "clean"' "$RUNNER_TEMP/action-update-pr.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/files" \
            > "$RUNNER_TEMP/action-update-files.json"
          jq -e --argjson expected_files "$(jq .changed_files "$RUNNER_TEMP/action-update-pr.json")" '
            add | length == $expected_files and length > 0 and all(.[];
              .status == "modified" and (.filename | test("^\\.github/workflows/[A-Za-z0-9_-]+\\.yml$"))
              and (.patch | type == "string")
              and ([.patch | split("\n")[] | select(test("^[+-]"))] as $changes
                | ($changes | length) > 0
                and ([$changes[] | select(startswith("+"))] | length) == .additions
                and ([$changes[] | select(startswith("-"))] | length) == .deletions
                and all($changes[]; test("^[+-] +uses: [A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@[0-9a-f]{40}$"))
                and ([$changes[] | select(startswith("-")) | .[1:] | sub("@[0-9a-f]{40}$"; "")] | sort)
                  == ([$changes[] | select(startswith("+")) | .[1:] | sub("@[0-9a-f]{40}$"; "")] | sort)))
          ' "$RUNNER_TEMP/action-update-files.json"
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq .object.sha)
          if [ "$current" != "$BASE_REVISION" ]; then
            echo "::error::The default branch changed during the checks. The pull request stays open."
            exit 1
          fi
          comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_REVISION...$CHECKED_REVISION" --jq .status)
          test "$comparison" = ahead
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" --jq .head.sha)
          test "$head" = "$CHECKED_REVISION"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$DEFAULT_BRANCH" \
            -f sha="$CHECKED_REVISION" -F force=false
