name: update lock files

on:
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

concurrency:
  group: update-lock-files
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      base: ${{ steps.update.outputs.base }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Use the Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Update the lock files
        id: update
        run: |
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          nix flake update
          nix develop --no-update-lock-file -c cargo update -Z min-publish-age
          git diff --check
          git diff --exit-code -- . ':!Cargo.lock' ':!flake.lock'
          if git diff --quiet -- Cargo.lock flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the updated lock files
        if: ${{ steps.update.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: updated-lock-files
          path: |
            Cargo.lock
            flake.lock
          if-no-files-found: error
          retention-days: 7

  pull-request:
    needs: update
    if: ${{ needs.update.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    outputs:
      revision: ${{ steps.pull-request.outputs.revision }}
      number: ${{ steps.pull-request.outputs.number }}
    steps:
      - name: Check out the update base
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.update.outputs.base }}
      - name: Get the updated lock files
        uses: actions/download-artifact@v8
        with:
          name: updated-lock-files
      - name: Open the update pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git diff --check
          git diff --exit-code -- . ':!Cargo.lock' ':!flake.lock'
          branch="automation/lock-files-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git add -- Cargo.lock flake.lock
          if ! git config user.name > /dev/null; then
            git config user.name 'github-actions[bot]'
          fi
          if ! git config user.email > /dev/null; then
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          fi
          git commit -m 'chore: update lock files'
          revision=$(git rev-parse HEAD)
          git push origin "HEAD:refs/heads/$branch"
          cat > "$RUNNER_TEMP/lock-update-body.md" <<'BODY'
          Update flake.lock and Cargo.lock. Cargo uses the minimum publication age from .cargo/config.toml.

          The workflow runs the build, test and lint checks on both supported systems. It merges this pull request only by fast-forward, after the checks pass. If either branch changes, the pull request stays open.
          BODY
          gh pr create --base "$DEFAULT_BRANCH" --head "$branch" \
            --title 'chore: update lock files' --body-file "$RUNNER_TEMP/lock-update-body.md"
          number=$(gh pr view "$branch" --json number --jq .number)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$revision" \
            -f state=pending -f context=lock-file-update \
            -f description='Build, test and lint checks are running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  check:
    needs: [update, pull-request]
    if: ${{ needs.update.outputs.changed == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      revision: ${{ needs.pull-request.outputs.revision }}

  merge:
    needs: [update, pull-request, check]
    if: ${{ always() && needs.pull-request.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BASE_REVISION: ${{ needs.update.outputs.base }}
      CHECKED_REVISION: ${{ needs.pull-request.outputs.revision }}
      PULL_REQUEST: ${{ needs.pull-request.outputs.number }}
    steps:
      - name: Report the check result on the pull request
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          state=failure
          if [ "$CHECK_RESULT" = success ]; then
            state=success
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$CHECKED_REVISION" \
            -f state="$state" -f context=lock-file-update \
            -f description="Build, test and lint checks: $CHECK_RESULT" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          test "$state" = success
      - name: Check out the checked revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.pull-request.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fast-forward the pull request
        run: |
          git merge-base --is-ancestor "$BASE_REVISION" "$CHECKED_REVISION"
          mergeability_attempts=12
          mergeability_delay=5
          for ((attempt = 0; attempt < mergeability_attempts; attempt++)); do
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" > "$RUNNER_TEMP/lock-update-pr.json"
            if jq -e '.mergeable_state == "clean"' "$RUNNER_TEMP/lock-update-pr.json" > /dev/null; then
              break
            fi
            sleep "$mergeability_delay"
          done
          jq -e --arg revision "$CHECKED_REVISION" --arg branch "$DEFAULT_BRANCH" \
            --arg repository "$GITHUB_REPOSITORY" \
            '.state == "open" and .draft == false and .merged == false
              and .head.sha == $revision and .base.ref == $branch
              and .head.repo.full_name == $repository
              and .base.repo.full_name == $repository
              and .mergeable_state == "clean"' "$RUNNER_TEMP/lock-update-pr.json"
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq .object.sha)
          if [ "$current" != "$BASE_REVISION" ]; then
            echo "::error::The default branch changed during the checks. The pull request stays open."
            exit 1
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$DEFAULT_BRANCH" \
            -f sha="$CHECKED_REVISION" -F force=false
