name: merge dependency updates

on:
  workflow_run:
    workflows: [build]
    types: [completed]

concurrency:
  group: merge-dependency-updates-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  merge:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'pull_request'
          && github.event.workflow_run.head_repository.full_name == github.repository
          && github.event.workflow_run.pull_requests[0].number != null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BASE_REVISION: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
      CHECKED_REVISION: ${{ github.event.workflow_run.head_sha }}
      PULL_REQUEST: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - name: Verify and fast-forward the Dependabot pull request
        run: |
          [[ "$BASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CHECKED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PULL_REQUEST" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" > "$RUNNER_TEMP/dependency-update-pr.json"
          if ! jq -e '.user.login == "dependabot[bot]" and .user.type == "Bot"' \
            "$RUNNER_TEMP/dependency-update-pr.json" > /dev/null; then
            exit 0
          fi
          mergeability_attempts=12
          mergeability_delay=5
          for ((attempt = 0; attempt < mergeability_attempts; attempt++)); do
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" > "$RUNNER_TEMP/dependency-update-pr.json"
            if jq -e '.mergeable_state == "clean"' "$RUNNER_TEMP/dependency-update-pr.json" > /dev/null; then
              break
            fi
            sleep "$mergeability_delay"
          done
          jq -e --arg revision "$CHECKED_REVISION" --arg base "$BASE_REVISION" \
            --arg branch "$DEFAULT_BRANCH" --arg repository "$GITHUB_REPOSITORY" \
            '.user.login == "dependabot[bot]" and .user.type == "Bot"
              and .state == "open" and .draft == false and .merged == false
              and .head.sha == $revision and .base.sha == $base and .base.ref == $branch
              and .head.repo.full_name == $repository and .base.repo.full_name == $repository
              and .mergeable_state == "clean"' "$RUNNER_TEMP/dependency-update-pr.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/files" \
            > "$RUNNER_TEMP/dependency-update-files.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/commits" \
            > "$RUNNER_TEMP/dependency-update-commits.json"
          jq -e --arg revision "$CHECKED_REVISION" \
            --argjson expected_commits "$(jq .commits "$RUNNER_TEMP/dependency-update-pr.json")" '
            add | length == $expected_commits and length > 0 and .[-1].sha == $revision
              and all(.[]; .author.login == "dependabot[bot]" and .author.type == "Bot"
                and .commit.verification.verified == true
                and .commit.verification.reason == "valid")
          ' "$RUNNER_TEMP/dependency-update-commits.json"
          jq -e --argjson expected_files "$(jq .changed_files "$RUNNER_TEMP/dependency-update-pr.json")" '
            add | length == $expected_files and length > 0 and all(.[];
              .status == "modified" and (.filename == "Cargo.lock" or .filename == "flake.lock" or
              ((.filename | test("^\\.github/workflows/[A-Za-z0-9_-]+\\.yml$"))
              and (.patch | type == "string")
              and ([.patch | split("\n")[] | select(test("^[+-]"))] as $changes
                | ($changes | length) > 0
                and ([$changes[] | select(startswith("+"))] | length) == .additions
                and ([$changes[] | select(startswith("-"))] | length) == .deletions
                and all($changes[]; test("^[+-] +uses: [A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@[0-9a-f]{40}$"))
                and ([$changes[] | select(startswith("-")) | .[1:] | sub("@[0-9a-f]{40}$"; "")] | sort)
                  == ([$changes[] | select(startswith("+")) | .[1:] | sub("@[0-9a-f]{40}$"; "")] | sort)))))
          ' "$RUNNER_TEMP/dependency-update-files.json"
          if jq -e 'add | any(.[]; .filename == "Cargo.lock")' \
            "$RUNNER_TEMP/dependency-update-files.json" > /dev/null; then
            if jq -e 'add | all(.[];
              .commit.message | split("\n") | index("dependency-group: cargo-security") != null)' \
              "$RUNNER_TEMP/dependency-update-commits.json" > /dev/null; then
              echo "The signed Cargo security update is exempt from the publication age check."
            else
              gh api "repos/$GITHUB_REPOSITORY/contents/.cargo/config.toml?ref=$BASE_REVISION" \
                --jq .content | base64 --decode > "$RUNNER_TEMP/cargo-config.toml"
              gh api "repos/$GITHUB_REPOSITORY/contents/Cargo.lock?ref=$BASE_REVISION" \
                --jq .content | base64 --decode > "$RUNNER_TEMP/base-Cargo.lock"
              gh api "repos/$GITHUB_REPOSITORY/contents/Cargo.lock?ref=$CHECKED_REVISION" \
                --jq .content | base64 --decode > "$RUNNER_TEMP/head-Cargo.lock"
              python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import re
          import time
          import tomllib
          import urllib.parse
          import urllib.request

          directory = pathlib.Path(os.environ["RUNNER_TEMP"])
          config = tomllib.loads((directory / "cargo-config.toml").read_text())
          age = config["registry"]["global-min-publish-age"]
          match = re.fullmatch(r"([0-9]+) days?", age)
          if match is None:
              raise SystemExit("Unsupported Cargo publication age: " + age)
          cutoff = datetime.datetime.now(datetime.UTC) - datetime.timedelta(days=int(match[1]))

          def packages(filename):
              lock = tomllib.loads((directory / filename).read_text())
              return {
                  (item["name"], item["version"], item.get("source", ""))
                  for item in lock["package"]
              }

          additions = packages("head-Cargo.lock") - packages("base-Cargo.lock")
          for name, version, source in sorted(additions):
              if source != "registry+https://github.com/rust-lang/crates.io-index":
                  raise SystemExit("Cannot check publication age for " + name + ": " + source)
              url = "https://crates.io/api/v1/crates/{}/{}".format(
                  urllib.parse.quote(name, safe=""), urllib.parse.quote(version, safe="")
              )
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "weinav-forge dependency age check (GitHub Actions)"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.load(response)["version"]
              if release["crate"] != name or release["num"] != version:
                  raise SystemExit("Unexpected release metadata for " + name)
              published = datetime.datetime.fromisoformat(release["created_at"])
              if published > cutoff:
                  raise SystemExit(name + " " + version + " is younger than " + age)
              print(name + " " + version + " meets the publication age")
              time.sleep(1)
          PY
            fi
          fi
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq .object.sha)
          if [ "$current" != "$BASE_REVISION" ]; then
            echo "::error::The default branch changed during the checks. The pull request stays open."
            exit 1
          fi
          comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_REVISION...$CHECKED_REVISION" --jq .status)
          test "$comparison" = ahead
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" \
            | jq -e --arg revision "$CHECKED_REVISION" --arg base "$BASE_REVISION" '
                .state == "open" and .draft == false and .merged == false
                  and .head.sha == $revision and .base.sha == $base
                  and .mergeable_state == "clean"'
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$DEFAULT_BRANCH" \
            -f sha="$CHECKED_REVISION" -F force=false
